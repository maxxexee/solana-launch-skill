name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-repo.mjs